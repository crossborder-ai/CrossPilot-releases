<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="north" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- C arc (opens right, represents "Cross") -->
  <path d="M 340 156 A 130 130 0 1 0 340 356"
        stroke="#FFFFFF" stroke-width="36" fill="none" stroke-linecap="round"/>

  <!-- Compass needle: south half (white, represents guidance) -->
  <path d="M 256 334 L 292 256 L 220 256 Z" fill="#FFFFFF" opacity="0.82"/>

  <!-- Compass needle: north half (cyan gradient, represents "Pilot" / direction) -->
  <path d="M 256 178 L 292 256 L 220 256 Z" fill="url(#north)"/>

  <!-- Center pivot -->
  <circle cx="256" cy="256" r="5" fill="#4F46E5"/>
</svg>
